name: Build CleanYourTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x launcher/gradlew

      - name: Build Debug and Release APKs
        working-directory: launcher
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK (Supports run-as)
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Debug-APK
          path: launcher/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (Faster daily use)
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Release-APK
          path: launcher/app/build/outputs/apk/release/*.apk
